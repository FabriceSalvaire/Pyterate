[build-system]
requires = ["uv_build >= 0.12.5, <0.13.0"]
build-backend = "uv_build"

[project]
name = "pyterate"
version = "2.1.5"
# dynamic = ["version"]

dependencies = [
    "jinja2",
    "jupyter",
    "jupyter-client",
    "myst-parser",
    "nbformat",
    "pypandoc",
    "pyyaml",
    "sphinx",
    "sphinxcontrib-getthecode",
]
requires-python = ">=3.15"

author = {name = "Fabrice Salvaire", email="fabrice.salvaire@orange.fr"}
maintainer = {name = "Fabrice Salvaire", email="fabrice.salvaire@orange.fr"}
description = "Pyterate is a Sphinx add-ons to generate API documentation using autogen and litterate programming documentation for Python projects."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE.md"]  # "gpl-3.0.md"
keywords = ["sphinx", "autogen", "documentation", "generator", "builder", "literate", "programming"]
# cf. https://pypi.org/classifiers
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: Sphinx :: Extension",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Documentation",
]

[project.urls]
# cf. https://packaging.python.org/en/latest/specifications/well-known-project-urls/#well-known-labels
Homepage = "https://github.com/FabriceSalvaire/Pyterate"
Source = "https://fabricesalvaire.github.io/Pyterate"
# Download = ""
# Changelog = ""
# ReleaseNotes = ""
# Documentation = ""
# Issues = ""
# Funding = ""


[dependency-groups]
dev = [
  "invoke",
  "matplotlib",
  "numpy",
  "rassumfrassum>=0.3.4",
  "ruff>=0.16.5",
  "sphinx-design",
  "sphinx-rtd-theme",
  "ty>=0.0.75",
]


[tool.uv.sources]
sphinxcontrib-getthecode = { git = "https://github.com/FabriceSalvaire/sphinx-getthecode" }


[tool.ruff]
# Exclude a variety of commonly ignored directories
# exclude = [...]

line-length = 100
indent-width = 4

target-version = "py315"


[tool.ruff.lint]
preview = true

# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
# select = ["E4", "E7", "E9", "F"]
select = [
# pycodestyle
"E",
# Pyflakes
"F",
# pyupgrade
"UP",
# flake8-bugbear
"B",
# flake8-simplify
"SIM",
# isort
"I",
]
ignore = [
"E302", # blank-lines-top-level
"E305", # blank-lines-after-function-or-class
]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
# dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"


[tool.ruff.format]
quote-style = "preserve"   # else single | double
indent-style = "space"
# skip-magic-trailing-comma = false
# line-ending = "auto"

# reStructuredText code/literal blocks and doctests are all supported.
# This is currently disabled by default, but it is planned for this to be opt-out in the future.
# docstring-code-format = false
#
# Set the line length limit used when formatting code snippets in docstrings.
# This only has an effect when the `docstring-code-format` setting is enabled.
# docstring-code-line-length = "dynamic"
